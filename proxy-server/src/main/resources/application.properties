proxy.port=8080
proxy.max-threads=50
proxy.client-timeout=60000
proxy.upstream.connect-timeout=10000

https.enabled=true
https.allow-private-destinations=false
https.tunnel-timeout=60000

ssh.enabled=true
ssh.default-port=22
ssh.connect-timeout=10000
ssh.known-hosts-path=${user.home}/.ssh/known_hosts

# Database configuration. Credentials should be supplied through environment variables.
database.enabled=false
database.url=jdbc:sqlserver://localhost:1433;databaseName=NetworkProxyDB;encrypt=true;trustServerCertificate=false;loginTimeout=10
database.username=
database.password=
