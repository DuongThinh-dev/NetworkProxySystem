version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: networkproxy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: NetworkProxyDB
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql-create-tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql
      - ./database/mysql-indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
