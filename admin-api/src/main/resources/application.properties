server.port=8081
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=NETWORK_PROXY_ADMIN_SESSION

# MySQL Database Configuration
# Default: MySQL running in Docker container on port 3307
# Override with environment variables: NETWORK_PROXY_DB_URL, NETWORK_PROXY_DB_USERNAME, NETWORK_PROXY_DB_PASSWORD
spring.datasource.url=${NETWORK_PROXY_DB_URL:jdbc:mysql://localhost:3307/NetworkProxyDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${NETWORK_PROXY_DB_USERNAME:root}
spring.datasource.password=${NETWORK_PROXY_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Schema is managed by database/create-tables.sql and database/indexes.sql.
spring.sql.init.mode=never

# Default admin account. DataInitializer creates it only when AdminUsers is empty.
admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default-password=${ADMIN_DEFAULT_PASSWORD:admin123}
# Để trống để dùng giá trị mặc định trong AdminProperties (UTF-8 an toàn).
admin.default-display-name=${ADMIN_DEFAULT_DISPLAY_NAME:}

# Optional integration with proxy-server control API.
# Enable proxy.control.enabled and set the same token in proxy-server.
proxy.control.enabled=${PROXY_CONTROL_ENABLED:false}
proxy.control.url=${PROXY_CONTROL_URL:http://127.0.0.1:8082}
proxy.control.token=${PROXY_CONTROL_TOKEN:dev-token-change-me}

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.networkproxy=INFO
