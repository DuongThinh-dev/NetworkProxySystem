<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Rules | Network Proxy Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="topbar"></header>
        <main class="page">
            <div class="page-header">
                <div>
                    <h1>Access Rules</h1>
                    <p class="page-subtitle">Quản lý quy tắc ALLOW / BLOCK cho HTTP, HTTPS và SSH.</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" type="button" id="add-rule">+ Thêm rule</button>
                </div>
            </div>

            <section class="card">
                <form class="filter-bar" id="rule-filters">
                    <input class="input input--grow" type="search" id="rule-search"
                           placeholder="Tìm theo ID, client IP hoặc target...">
                    <select class="select" id="rule-enabled" aria-label="Lọc trạng thái">
                        <option value="">Tất cả trạng thái</option>
                        <option value="true">Đang bật</option>
                        <option value="false">Đang tắt</option>
                    </select>
                    <button class="btn btn-secondary" type="submit">Lọc</button>
                    <button class="btn btn-ghost" type="button" id="reset-rule-filters">Xóa lọc</button>
                </form>

                <div class="table-wrap" id="rules-table">
                    <div class="table-empty">Đang tải danh sách rule...</div>
                </div>
                <div class="pagination" id="rules-pagination"></div>
            </section>
        </main>
    </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-stack" aria-live="polite"></div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/rules.js"></script>
</body>
</html>
