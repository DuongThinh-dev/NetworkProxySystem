<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs | Network Proxy Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="topbar"></header>
        <main class="page">
            <div class="page-header">
                <div>
                    <h1>Audit Logs</h1>
                    <p class="page-subtitle">Nhật ký thao tác quản trị trên Admin Console.</p>
                </div>
            </div>

            <section class="card">
                <div class="table-wrap" id="audit-table">
                    <div class="table-empty">Đang tải audit log...</div>
                </div>
                <div class="pagination" id="audit-pagination"></div>
            </section>
        </main>
    </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-stack" aria-live="polite"></div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/audit.js"></script>
</body>
</html>
